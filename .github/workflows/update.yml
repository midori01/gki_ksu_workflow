name: Check Kernel Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel Version to Check'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '6.1'
          - '6.6'
          - '6.12'
  workflow_call:
    inputs:
      kernel_version:
        required: false
        type: string
        default: 'all'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap toolchain releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_SOURCE_REPO: ${{ vars.TOOLCHAIN_SOURCE_REPO || 'midori01/gki_ksu_workflow' }}
        run: bash .github/scripts/bootstrap_toolchains.sh

      - name: Run update check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KERNEL_VERSION_TO_CHECK: ${{ inputs.kernel_version || 'all' }}
        run: bash .github/scripts/check_updates.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/config/kernel_versions.json
          git diff --staged --quiet || git commit -m "auto: update kernel versions"
          git push
