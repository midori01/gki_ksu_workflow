name: Module - Build Kernel Image

on:
  workflow_call:
    inputs:
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      variant:
        required: true
        type: string
      use_droidspaces:
        required: true
        type: boolean
      use_rekernel:
        required: false
        type: boolean
        default: true
      use_susfs:
        required: true
        type: boolean
      susfs_repo:
        required: false
        type: string
        default: 'GitLab'
      midorisu_kx_branch:
        required: false
        type: string
        default: 'KOWX712/KernelSU:master'
      midorisu_nx_branch:
        required: false
        type: string
        default: 'KernelSU-Next/KernelSU-Next:dev'
      midorisu_ox_branch:
        required: false
        type: string
        default: 'tiann/KernelSU:main'
      midorisu_rx_branch:
        required: false
        type: string
        default: 'ReSukiSU/ReSukiSU:main'
      midorisu_xx_branch:
        required: false
        type: string
        default: 'backslashxx/KernelSU:master'
      hook_mode:
        required: false
        type: string
      ksu_debug:
        required: false
        type: boolean
        default: false
      upload_vmlinux:
        required: false
        type: boolean
        default: false
      source_mirror:
        required: true
        type: string
      use_ccache:
        required: false
        type: boolean
        default: true
      use_adios:
        required: false
        type: boolean
        default: false
      use_lz4_zstd:
        required: false
        type: boolean
        default: false
      susfs_commit:
        required: false
        type: string
        default: ''
      kernel_localversion:
        required: true
        type: string
      build_epoch:
        required: true
        type: string
      build_timestamp:
        required: true
        type: string
      build_user:
        required: true
        type: string
      build_host:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DS_SUFFIX: ${{ inputs.use_droidspaces && '-DS' || '' }}
      SUSFS_SUFFIX: ${{ inputs.use_susfs && '-SUSFS' || '' }}
      ADIOS_SUFFIX: ${{ inputs.use_adios && inputs.kernel_version != '6.1' && '-ADIOS' || '' }}
      ZRAM_SUFFIX: ${{ inputs.use_lz4_zstd && inputs.kernel_version == '6.12' && '-LZ4ZSTD' || '' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.variant }}${{ inputs.use_susfs && '-susfs' || '' }}${{ inputs.use_droidspaces && '-ds' || '' }}${{ inputs.use_adios && inputs.kernel_version != '6.1' && '-adios' || '' }}${{ inputs.use_lz4_zstd && inputs.kernel_version == '6.12' && '-lz4-zstd' || '' }}
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Pull latest config
        run: |
          git fetch origin ${{ github.ref_name }} --depth=1 2>/dev/null || true
          git checkout FETCH_HEAD -- .github/config/kernel_versions.json 2>/dev/null || true

      - name: Load Config
        id: cfg
        run: |
          config=$(jq -c '.["'${{ inputs.kernel_version }}'"]' .github/config/kernel_versions.json)
          echo "android_version=$(echo "$config" | jq -r '.android_version')" >> $GITHUB_OUTPUT
          sub_level="${{ inputs.sub_level }}"
          echo "sub_level=$sub_level" >> $GITHUB_OUTPUT
          revision=$(echo "$config" | jq -c '.revisions["'$sub_level'"]')
          echo "asb_date=$(echo "$revision" | jq -r '.asb_date')" >> $GITHUB_OUTPUT
          r_version=$(echo "$revision" | jq -r '.default_r')
          echo "r_version=$r_version" >> $GITHUB_OUTPUT
          echo "r_suffix=$([ "$r_version" != "none" ] && echo "_$r_version" || echo '')" >> $GITHUB_OUTPUT
          echo "clang_version=$(echo "$config" | jq -r '.default_clang')" >> $GITHUB_OUTPUT
          rust=$(echo "$config" | jq -r '.rust')
          echo "rust_enabled=$rust" >> $GITHUB_OUTPUT
          [ "$rust" = "true" ] && echo "rust_version=$(echo "$config" | jq -r '.default_rust')" >> $GITHUB_OUTPUT
          echo "mirror_tag=$(echo "$config" | jq -r '.mirror_tag')" >> $GITHUB_OUTPUT
          echo "anykernel_branch=$(echo "$config" | jq -r '.anykernel_branch')" >> $GITHUB_OUTPUT
          echo "kmi_version=$(echo "$config" | jq -r '.android_version')-${{ inputs.kernel_version }}" >> $GITHUB_OUTPUT

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true &
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libdw-dev bison flex bc aria2 ccache

      - name: Restore Ccache
        if: inputs.use_ccache
        id: cache-restore
        uses: ./.github/actions/restore-cache-retry
        with:
          path: .ccache-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.variant }}${{ inputs.use_susfs && '-susfs' || '' }}${{ inputs.use_droidspaces && '-ds' || '' }}${{ inputs.use_adios && inputs.kernel_version != '6.1' && '-adios' || '' }}${{ inputs.use_lz4_zstd && inputs.kernel_version == '6.12' && '-lz4-zstd' || '' }}
          key: ${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ steps.cfg.outputs.asb_date }}${{ steps.cfg.outputs.r_suffix }}-${{ inputs.variant }}${{ inputs.use_susfs && '-susfs' || '' }}${{ inputs.use_droidspaces && '-ds' || '' }}${{ inputs.use_adios && inputs.kernel_version != '6.1' && '-adios' || '' }}${{ inputs.use_lz4_zstd && inputs.kernel_version == '6.12' && '-lz4-zstd' || '' }}-${{ github.run_id }}
          restore-keys: ${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ steps.cfg.outputs.asb_date }}${{ steps.cfg.outputs.r_suffix }}-${{ inputs.variant }}${{ inputs.use_susfs && '-susfs' || '' }}${{ inputs.use_droidspaces && '-ds' || '' }}${{ inputs.use_adios && inputs.kernel_version != '6.1' && '-adios' || '' }}${{ inputs.use_lz4_zstd && inputs.kernel_version == '6.12' && '-lz4-zstd' || '' }}-

      - name: Setup Ccache Wrappers
        if: inputs.use_ccache
        run: |
          for i in $(seq 1 60); do which ccache >/dev/null 2>&1 && break; sleep 1; done
          which ccache || { echo "ccache not found after waiting"; exit 1; }
          CCACHE_PATH="${{ github.workspace }}/.ccache-bin"
          mkdir -p "$CCACHE_PATH" && rm -f "$CCACHE_PATH"/*
          for prog in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-size llvm-readelf llvm-strip; do
            ln -sf "$(which ccache)" "$CCACHE_PATH/$prog"
          done
          echo "$CCACHE_PATH" >> $GITHUB_PATH
          ccache -M 10G \
            -o hash_dir=false \
            -o compiler_check=content \
            -o "sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,modules" \
            -o depend_mode=true \
            -o run_second_cpp=true \
            -o compression=true \
            -o compression_level=1 \
            -o keep_comments_cpp=true \
            -o "cache_dir=${{ env.CCACHE_DIR }}" \
            -o "base_dir=${{ github.workspace }}" \
            -o file_clone=false \
            -o hard_link=false \
            -z

      - name: Download Toolchains & Kernel Source
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          MIDORI_MIRROR="https://github.com/${{ github.repository }}/releases/download/${{ steps.cfg.outputs.mirror_tag }}"
          CLANG_TAR="clang-${{ steps.cfg.outputs.clang_version }}.tar.gz"
          case "${{ steps.cfg.outputs.asb_date }}" in
            lts)
              branch="${{ steps.cfg.outputs.android_version }}-${{ inputs.kernel_version }}-lts"
              KERNEL_TAR="${branch}.tar.gz"
              if [ "${{ inputs.source_mirror }}" = "google" ]; then
                KERNEL_BASE_URL="https://android.googlesource.com/kernel/common/+archive/refs/heads/${branch}"
              else
                KERNEL_BASE_URL="$MIDORI_MIRROR"
              fi ;;
            *)
              if [ "${{ steps.cfg.outputs.r_version }}" = "none" ]; then
                branch="${{ steps.cfg.outputs.android_version }}-${{ inputs.kernel_version }}-${{ steps.cfg.outputs.asb_date }}"
                KERNEL_TAR="${branch}.tar.gz"
                if [ "${{ inputs.source_mirror }}" = "google" ]; then
                  KERNEL_BASE_URL="https://android.googlesource.com/kernel/common/+archive/refs/heads/${branch}"
                else
                  KERNEL_BASE_URL="$MIDORI_MIRROR"
                fi
              else
                tag="${{ steps.cfg.outputs.android_version }}-${{ inputs.kernel_version }}-${{ steps.cfg.outputs.asb_date }}_${{ steps.cfg.outputs.r_version }}"
                KERNEL_TAR="${tag}.tar.gz"
                if [ "${{ inputs.source_mirror }}" = "google" ]; then
                  KERNEL_BASE_URL="https://android.googlesource.com/kernel/common/+archive/refs/tags/${tag}"
                else
                  KERNEL_BASE_URL="$MIDORI_MIRROR"
                fi
              fi ;;
          esac
          retry() { for i in $(seq 1 30); do "$@" && return 0; echo "Retry $i/30..."; sleep 30; done; return 1; }
          retry aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/$CLANG_TAR" -o clang.tar.gz &
          retry aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/build-tools.tar.gz" -o build-tools.tar.gz &
          [ "${{ steps.cfg.outputs.rust_enabled }}" = "true" ] && {
            retry aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/clang-tools.tar.gz" -o clang-tools.tar.gz &
            retry aria2c -s16 -x16 -k1M "$MIDORI_MIRROR/rust-${{ steps.cfg.outputs.rust_version }}.tar.gz" -o rust.tar.gz &
          }
          retry aria2c -s16 -x16 -k1M "$KERNEL_BASE_URL/$KERNEL_TAR" -o common.tar.gz &
          wait
          for f in *.tar.gz; do mkdir -p "${f%%.*}" && tar -xzf "$f" -C "${f%%.*}" & done
          wait
          rm -f *.tar.gz
          rm -f common/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g' common/scripts/setlocalversion || true
          sed -i ':a; /#ifdef USE_PKCS11_ENGINE/{N;N;s/#ifdef USE_PKCS11_ENGINE\n\(.*\)\n#endif/\1/; ta}' common/certs/extract-cert.c || true

      - name: Setup KernelSU
        working-directory: kernel_workspace/common
        run: |
          echo "[+] Fetching commit count from MidoriSU..."
          COMMIT_COUNT=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/midori01/KernelSU/commits?per_page=1" \
            -I 2>&1 | grep "link:" | grep -oP '&page=\K\d+(?=>; rel="last")')
          COMMIT_COUNT=${COMMIT_COUNT:-0}
          KSU_VERSION=$((30999 + COMMIT_COUNT))
          echo "[+] KSU_VERSION=$KSU_VERSION"
          mkdir -p commit_info
          echo "$KSU_VERSION" > commit_info/driver_version
          export KSU_VERSION
          case "${{ inputs.variant }}" in
            MidoriSU-KX)
              IFS=':' read -r REPO BRANCH <<< "${{ inputs.midorisu_kx_branch }}"
              git clone --branch "${BRANCH}" "https://github.com/${REPO}.git" KernelSU
              patch -p1 -d KernelSU --forward < "${{ github.workspace }}/.github/patches/24_extra_features_for_ksu.patch" || true
              ;;
            MidoriSU-NX)
              IFS=':' read -r REPO BRANCH <<< "${{ inputs.midorisu_nx_branch }}"
              git clone --branch "${BRANCH}" "https://github.com/${REPO}.git" KernelSU
              patch -p1 -d KernelSU --forward < "${{ github.workspace }}/.github/patches/22_extra_features_for_ksu.patch" || true
              ;;
            MidoriSU-OX)
              IFS=':' read -r REPO BRANCH <<< "${{ inputs.midorisu_ox_branch }}"
              git clone --branch "${BRANCH}" "https://github.com/${REPO}.git" KernelSU
              patch -p1 -d KernelSU --forward < "${{ github.workspace }}/.github/patches/20_extra_features_for_ksu.patch" || true
              [ "${{ inputs.use_susfs }}" != "true" ] && patch -p1 -d KernelSU --forward < "${{ github.workspace }}/.github/patches/31_ksu_toolkit_for_ksu.patch" || true
              ;;
            MidoriSU-RX)
              IFS=':' read -r REPO BRANCH <<< "${{ inputs.midorisu_rx_branch }}"
              git clone --branch "${BRANCH}" "https://github.com/${REPO}.git" KernelSU
              patch -p1 -d KernelSU --forward < "${{ github.workspace }}/.github/patches/23_extra_features_for_ksu.patch" || true
              ;;
            MidoriSU-XX)
              IFS=':' read -r REPO BRANCH <<< "${{ inputs.midorisu_xx_branch }}"
              git clone --branch "${BRANCH}" "https://github.com/${REPO}.git" KernelSU
              patch -p1 -d KernelSU --forward < "${{ github.workspace }}/.github/patches/21_extra_features_for_ksu.patch" || true
              ;;
          esac
          bash "${{ github.workspace }}/.github/scripts/setup_ksu.sh"
          ln -sf ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Setup SUSFS
        if: inputs.use_susfs
        working-directory: kernel_workspace/common
        env:
          SUSFS_DIR: ${{ github.workspace }}/susfs4ksu
          SUSFS_REPO: ${{ inputs.susfs_repo == 'GitHub' && 'https://github.com/midori01/susfs4ksu' || 'https://gitlab.com/simonpunk/susfs4ksu' }}
          SUSFS_COMMIT: ${{ inputs.susfs_commit }}
          KMI_VERSION: ${{ steps.cfg.outputs.kmi_version }}
        run: |
          [ -n "$SUSFS_COMMIT" ] && git clone "$SUSFS_REPO" "$SUSFS_DIR" || git clone --depth 1 --no-single-branch "$SUSFS_REPO" "$SUSFS_DIR"
          git -C "$SUSFS_DIR" checkout "${SUSFS_COMMIT:-gki-$KMI_VERSION}"     
          cp "$SUSFS_DIR"/kernel_patches/fs/* fs/
          cp "$SUSFS_DIR"/kernel_patches/include/linux/* include/linux/
          if [ "${{ inputs.kernel_version }}" = "6.12" ]; then
            PATCH_VER="$KMI_VERSION.${{ inputs.sub_level }}"
          else
            PATCH_VER="$KMI_VERSION"
          fi
          case "${{ inputs.variant }}" in
            MidoriSU-KX)
              patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/50_add_susfs_in_gki-${PATCH_VER}.patch"
              patch -p1 -d KernelSU < "${{ github.workspace }}/.github/patches/10_enable_susfs_for_ksu.patch"
              ;;
            MidoriSU-NX)
              patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/50_add_susfs_in_gki-${PATCH_VER}.patch"
              patch -p1 -d KernelSU < "${{ github.workspace }}/.github/patches/12_enable_susfs_for_ksu.patch"
              ;;
            MidoriSU-OX)
              patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/50_add_susfs_in_gki-${PATCH_VER}.patch"
              patch -p1 -d KernelSU < "$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
              patch -p1 -d KernelSU < "${{ github.workspace }}/.github/patches/30_ksu_toolkit_for_ksu.patch"
              ;;
            MidoriSU-RX)
              patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/50_add_susfs_in_gki-${PATCH_VER}.patch"
              ;;
            MidoriSU-XX)
              patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/51_deinlined_susfs_hooks_gki-${PATCH_VER}.patch"
              patch -p1 -d KernelSU < "${{ github.workspace }}/.github/patches/11_enable_susfs_for_ksu.patch"
              ;;
          esac

      - name: Setup Manual Hooks
        if: >-
          (inputs.variant == 'MidoriSU-XX' && inputs.hook_mode != 'hookless') ||
          (inputs.variant == 'MidoriSU-RX' && inputs.hook_mode == 'manual' && inputs.use_susfs != true)
        working-directory: kernel_workspace/common
        run: |
          case "${{ inputs.variant }}" in
            MidoriSU-XX)
              patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/scope-min-manual-hooks-v2.3.patch"
              ;;
            MidoriSU-RX)
              patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/resukisu-manual-hooks.patch"
              ;;
          esac

      - name: Setup Droidspaces
        if: inputs.use_droidspaces
        working-directory: kernel_workspace/common
        run: |
          patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/fix_sysvipc_kabi.patch"
          patch -p1 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/ntsync_base_compat.patch"

      - name: Setup ReKernel
        if: inputs.use_rekernel
        working-directory: kernel_workspace/common
        run: |
          REKERNEL_DIR="${{ github.workspace }}/ReKernel"
          REKERNEL_X_DIR="${{ github.workspace }}/ReKernel_X"
          git clone --filter=blob:none https://github.com/Sakion-Team/Re-Kernel "$REKERNEL_DIR"
          git clone --filter=blob:none https://github.com/myflavor/ReKernel-X "$REKERNEL_X_DIR"
          REKERNEL_TAG=$(git -C "$REKERNEL_DIR" describe --tags --abbrev=0) && git -C "$REKERNEL_DIR" checkout "tags/$REKERNEL_TAG"
          REKERNEL_X_TAG=$(git -C "$REKERNEL_X_DIR" describe --tags --abbrev=0) && git -C "$REKERNEL_X_DIR" checkout "tags/$REKERNEL_X_TAG"
          cp -r "$REKERNEL_DIR"/LKM-Source drivers/rekernel
          sed -i 's/depends on MODULES/depends on KSU/' drivers/rekernel/Kconfig
          sed -i 's/obj-m := rekernel.o/obj-$(CONFIG_REKERNEL) += rekernel.o/' drivers/rekernel/Makefile
          echo 'obj-$(CONFIG_REKERNEL) += rekernel/' >> drivers/Makefile
          grep -q "drivers/rekernel/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          cp -r "$REKERNEL_X_DIR"/LKM-Source drivers/rekernel_x
          sed -i 's/\bstart_rekernel\b/rkx_start/g; s/\bexit_rekernel\b/rkx_exit/g; s/\bsendMessage\b/rkx_sendMessage/g; s/\bnet_uid_add\b/rkx_net_uid_add/g; s/\bnet_uid_del\b/rkx_net_uid_del/g; s/\bregister_signal\b/rkx_register_signal/g; s/\bunregister_signal\b/rkx_unregister_signal/g; s/\bregister_netfilter\b/rkx_register_netfilter/g; s/\bunregister_netfilter\b/rkx_unregister_netfilter/g; s/\bregister_binder\b/rkx_register_binder/g; s/\bunregister_binder\b/rkx_unregister_binder/g' drivers/rekernel_x/*.{c,h}
          sed -i 's/obj-m += rekernel_x.o/obj-y += rekernel_x.o/' drivers/rekernel_x/Makefile
          echo 'obj-y += rekernel_x/' >> drivers/Makefile
          echo "RKX_VERSION=v$REKERNEL_X_TAG" >> $GITHUB_ENV

      - name: Apply CVE-2026-43499 Fix
        working-directory: kernel_workspace/common
        run: |
          if bash "${{ github.workspace }}/.github/scripts/check_cve.sh" > /dev/null 2>&1; then
            echo "CVE-2026-43499 fix already present."
            echo "CVE_FIXED=true" >> $GITHUB_ENV
          else
            patch -p1 --forward < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/cve-2026-43499-fix.patch" || true
            if bash "${{ github.workspace }}/.github/scripts/check_cve.sh" > /dev/null 2>&1; then
              echo "CVE-2026-43499 fix applied successfully."
              echo "CVE_FIXED=true" >> $GITHUB_ENV
            else
              echo "::warning::CVE-2026-43499 fix could not be verified after patch."
              echo "CVE_FIXED=false" >> $GITHUB_ENV
            fi
          fi

      - name: Apply Unicode Bypass Fix
        working-directory: kernel_workspace/common
        run: |
          patch -p1 < "${{ github.workspace }}/.github/patches/unicode_bypass_fix_6.1+.patch"

      - name: Apply ADIOS I/O Scheduler
        if: inputs.use_adios && inputs.kernel_version != '6.1'
        working-directory: kernel_workspace/common
        run: |
          patch -p1 --forward --fuzz=3 < "${{ github.workspace }}/.github/patches/${{ steps.cfg.outputs.kmi_version }}/adios.patch"

      - name: Apply LZ4/ZSTD ZRAM
        if: inputs.use_lz4_zstd && inputs.kernel_version == '6.12'
        working-directory: kernel_workspace/common
        run: |
          patch --batch --forward -p1 < "${{ github.workspace }}/.github/patches/zram/lz4-1.10.0.patch"
          patch --batch --forward -p1 < "${{ github.workspace }}/.github/patches/zram/zstd-1.5.7.patch"

      - name: Inject Kernel Configs
        uses: ./.github/actions/kernel-config
        with:
          defconfig_path: "kernel_workspace/common/arch/arm64/configs/gki_defconfig"
          build_config_path: "kernel_workspace/common/build.config.gki"
          kernel_version: ${{ inputs.kernel_version }}
          sub_level: ${{ steps.cfg.outputs.sub_level }}
          variant: ${{ inputs.variant }}
          enable_susfs: ${{ inputs.use_susfs }}
          localversion: ${{ inputs.kernel_localversion }}
          use_droidspaces: ${{ inputs.use_droidspaces }}
          use_rekernel: ${{ inputs.use_rekernel }}
          use_adios: ${{ inputs.use_adios }}
          use_lz4_zstd: ${{ inputs.use_lz4_zstd }}
          hook_mode: ${{ inputs.hook_mode }}
          ksu_debug: ${{ inputs.ksu_debug }}

      - name: Save Commit Info
        working-directory: kernel_workspace/common
        run: |
          COMMIT_DIR="$(pwd)/commit_info"
          mkdir -p "$COMMIT_DIR"
          echo "${CVE_FIXED:-false}" > "$COMMIT_DIR/cve_fixed_${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
          cd KernelSU
          save_ksu_commit() {
            git rev-parse HEAD > "$COMMIT_DIR/${1}_ksu_commit"
            git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/${1}_ksu_date"
          }
          save_susfs_commit() {
            if [ "${{ inputs.use_susfs }}" = "true" ] && [ -d "${{ github.workspace }}/susfs4ksu" ]; then
              pushd "${{ github.workspace }}/susfs4ksu" > /dev/null
              git rev-parse HEAD > "$COMMIT_DIR/susfs_commit"
              git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/susfs_date"
              echo "${{ inputs.susfs_repo }}" > "$COMMIT_DIR/susfs_repo"
              popd > /dev/null
            fi
          }
          save_rekernel_commit() {
            if [ -d "${{ github.workspace }}/ReKernel" ]; then
              pushd "${{ github.workspace }}/ReKernel" > /dev/null
              git rev-parse HEAD > "$COMMIT_DIR/rekernel_commit"
              git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/rekernel_date"
              popd > /dev/null
            fi
          }
          save_rekernel_x_commit() {
            if [ -d "${{ github.workspace }}/ReKernel_X" ]; then
              pushd "${{ github.workspace }}/ReKernel_X" > /dev/null
              git rev-parse HEAD > "$COMMIT_DIR/rekernel_x_commit"
              git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M %z' HEAD > "$COMMIT_DIR/rekernel_x_date"
              popd > /dev/null
            fi
          }
          case "${{ inputs.variant }}" in
            MidoriSU-KX)
              save_ksu_commit midorisu_kx
              echo "${{ inputs.midorisu_kx_branch }}" | cut -d: -f1 | cut -d/ -f1 > "$COMMIT_DIR/midorisu_kx_ksu_author"
              echo "${{ inputs.midorisu_kx_branch }}" | cut -d: -f1 > "$COMMIT_DIR/midorisu_kx_ksu_repo"
              save_susfs_commit
              ;;
            MidoriSU-NX)
              save_ksu_commit midorisu_nx
              echo "${{ inputs.midorisu_nx_branch }}" | cut -d: -f1 | cut -d/ -f1 > "$COMMIT_DIR/midorisu_nx_ksu_author"
              echo "${{ inputs.midorisu_nx_branch }}" | cut -d: -f1 > "$COMMIT_DIR/midorisu_nx_ksu_repo"
              save_susfs_commit
              ;;
            MidoriSU-OX)
              save_ksu_commit midorisu_ox
              echo "${{ inputs.midorisu_ox_branch }}" | cut -d: -f1 | cut -d/ -f1 > "$COMMIT_DIR/midorisu_ox_ksu_author"
              echo "${{ inputs.midorisu_ox_branch }}" | cut -d: -f1 > "$COMMIT_DIR/midorisu_ox_ksu_repo"
              save_susfs_commit
              ;;
            MidoriSU-RX)
              save_ksu_commit midorisu_rx
              echo "${{ inputs.midorisu_rx_branch }}" | cut -d: -f1 | cut -d/ -f1 > "$COMMIT_DIR/midorisu_rx_ksu_author"
              echo "${{ inputs.midorisu_rx_branch }}" | cut -d: -f1 > "$COMMIT_DIR/midorisu_rx_ksu_repo"
              save_susfs_commit
              ;;
            MidoriSU-XX)
              save_ksu_commit midorisu_xx
              echo "${{ inputs.midorisu_xx_branch }}" | cut -d: -f1 | cut -d/ -f1 > "$COMMIT_DIR/midorisu_xx_ksu_author"
              echo "${{ inputs.midorisu_xx_branch }}" | cut -d: -f1 > "$COMMIT_DIR/midorisu_xx_ksu_repo"
              save_susfs_commit
              ;;
          esac
          save_rekernel_commit
          save_rekernel_x_commit

      - name: Upload Commit Info
        uses: actions/upload-artifact@v7
        with:
          name: commit-info-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.variant }}${{ env.SUSFS_SUFFIX }}${{ env.DS_SUFFIX }}${{ env.ADIOS_SUFFIX }}
          path: kernel_workspace/common/commit_info/
          retention-days: 1

      - name: Compile Kernel
        working-directory: kernel_workspace/common
        run: |
          WORK_DIR="${{ github.workspace }}/kernel_workspace"
          export PATH="${WORK_DIR}/clang/bin:${WORK_DIR}/build-tools/bin:${WORK_DIR}/clang-tools/bin:${WORK_DIR}/rust/bin:${PATH}"
          export LIBCLANG_PATH="${WORK_DIR}/clang/lib"
          if [ -d "${{ github.workspace }}/.ccache-bin" ]; then
            export PATH="${{ github.workspace }}/.ccache-bin:${PATH}"
          fi
          ROOT_REAL_PATH=$(dirname "$(readlink -f "$PWD")")
          export KBUILD_GENDWARFKSYMS_STABLE=1
          export KCFLAGS="-fdebug-prefix-map=$ROOT_REAL_PATH=. -fmacro-prefix-map=$ROOT_REAL_PATH=. -ffile-prefix-map=$ROOT_REAL_PATH=. -no-canonical-prefixes -pipe -fno-stack-protector -D__ANDROID_COMMON_KERNEL__ -Wno-unused-command-line-argument"
          export SOURCE_DATE_EPOCH="${{ inputs.build_epoch }}"
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
          export KBUILD_BUILD_HOST="${{ inputs.build_host }}"
          export KBUILD_BUILD_USER="${{ inputs.build_user }}"
          export RKX_VERSION="${RKX_VERSION}"
          make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          make -j$(nproc) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image
          [ "${{ inputs.use_ccache }}" = "true" ] && ccache -s || true

      - name: Export vmlinux for eBPF
        if: inputs.upload_vmlinux
        working-directory: kernel_workspace/common/out
        run: |
          [ -f "vmlinux" ] && zstd -T0 -10 vmlinux -o vmlinux.zst

      - name: Upload vmlinux Artifact
        if: inputs.upload_vmlinux
        uses: actions/upload-artifact@v7
        with:
          name: vmlinux-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.variant }}${{ env.SUSFS_SUFFIX }}${{ env.DS_SUFFIX }}${{ env.ADIOS_SUFFIX }}${{ env.ZRAM_SUFFIX }}
          path: kernel_workspace/common/out/vmlinux.zst
          retention-days: 1

      - name: Package Kernel
        working-directory: kernel_workspace
        run: |
          IMAGE="common/out/arch/arm64/boot/Image"
          [ -f "$IMAGE" ] || { echo "Binary Missing!"; exit 1; }
          ZIP_NAME="${{ inputs.variant }}_Kernel-${{ inputs.kernel_version }}.${{ steps.cfg.outputs.sub_level }}${{ steps.cfg.outputs.r_suffix }}${{ env.SUSFS_SUFFIX }}${{ env.DS_SUFFIX }}${{ env.ADIOS_SUFFIX }}${{ env.ZRAM_SUFFIX }}.zip"
          git clone --depth 1 --branch ${{ steps.cfg.outputs.anykernel_branch }} https://github.com/midori01/AnyKernel3 anykernel
          cp "$IMAGE" anykernel/
          cd anykernel && rm -rf .git && zip -r9 "../$ZIP_NAME" *
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Save Ccache
        if: inputs.use_ccache
        uses: actions/cache/save@v6
        with:
          path: .ccache-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.variant }}${{ inputs.use_susfs && '-susfs' || '' }}${{ inputs.use_droidspaces && '-ds' || '' }}${{ inputs.use_adios && inputs.kernel_version != '6.1' && '-adios' || '' }}${{ inputs.use_lz4_zstd && inputs.kernel_version == '6.12' && '-lz4-zstd' || '' }}
          key: ${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ steps.cfg.outputs.asb_date }}${{ steps.cfg.outputs.r_suffix }}-${{ inputs.variant }}${{ inputs.use_susfs && '-susfs' || '' }}${{ inputs.use_droidspaces && '-ds' || '' }}${{ inputs.use_adios && inputs.kernel_version != '6.1' && '-adios' || '' }}${{ inputs.use_lz4_zstd && inputs.kernel_version == '6.12' && '-lz4-zstd' || '' }}-${{ github.run_id }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.variant }}${{ env.SUSFS_SUFFIX }}${{ env.DS_SUFFIX }}${{ env.ADIOS_SUFFIX }}${{ env.ZRAM_SUFFIX }}${{ steps.cfg.outputs.r_suffix }}
          path: kernel_workspace/${{ env.ZIP_NAME }}
