name: Build TCP Congestion Control Module

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package TCP Congestion Control Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Package Module
        id: pkg
        run: |
          set -euo pipefail
          zip=$(bash .github/scripts/package_tcp_congestion.sh out)
          test -f "$zip"
          unzip -l "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.zip }}
          archive: false
          retention-days: 1
