name: Build and Release
run-name: ${{ format('{0}{1}', inputs.kernel_version == 'all' && inputs.ksu_variant == 'all' && 'All Kernels - All Variants' || inputs.kernel_version == 'all' && format('All Kernels - {0}', inputs.ksu_variant) || inputs.ksu_variant == 'all' && format('Kernel {0} - All Variants', inputs.kernel_version) || format('Kernel {0} - {1}', inputs.kernel_version, inputs.ksu_variant), inputs.ksu_debug && ' [DEBUG]' || '') }}

on:
  workflow_dispatch:
    inputs:
      source_mirror:
        description: 'Kernel Source'
        required: true
        default: 'midori'
        type: choice
        options:
          - midori
          - google
      kernel_version:
        description: 'Kernel Version'
        required: true
        default: '6.12'
        type: choice
        options:
          - 'all'
          - '6.1'
          - '6.6'
          - '6.12'
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - MidoriSU-KX
          - MidoriSU-NX
          - MidoriSU-OX
          - MidoriSU-RX
          - MidoriSU-XX
      midorisu_kx_branch:
        description: 'MidoriSU-KX Source'
        required: true
        default: 'KOWX712/KernelSU:master'
        type: choice
        options:
          - 'KOWX712/KernelSU:master'
          - 'midori01/KernelSU:kow'
      midorisu_nx_branch:
        description: 'MidoriSU-NX Source'
        required: true
        default: 'KernelSU-Next/KernelSU-Next:dev'
        type: choice
        options:
          - 'KernelSU-Next/KernelSU-Next:dev'
          - 'midori01/KernelSU:next'
      midorisu_ox_branch:
        description: 'MidoriSU-OX Source'
        required: true
        default: 'tiann/KernelSU:main'
        type: choice
        options:
          - 'tiann/KernelSU:main'
          - 'midori01/KernelSU:official'
      midorisu_rx_branch:
        description: 'MidoriSU-RX Source'
        required: true
        default: 'ReSukiSU/ReSukiSU:main'
        type: choice
        options:
          - 'ReSukiSU/ReSukiSU:main'
          - 'midori01/KernelSU:resuki'
      midorisu_rx_hook_mode:
        description: 'MidoriSU-RX Hook Mode'
        required: true
        default: 'manual'
        type: choice
        options:
          - 'manual'
          - 'tracepoint'
      midorisu_xx_branch:
        description: 'MidoriSU-XX Source'
        required: true
        default: 'backslashxx/KernelSU:master'
        type: choice
        options:
          - 'backslashxx/KernelSU:master'
          - 'backslashxx/KernelSU:staging'
          - 'midori01/KernelSU:xx'
      midorisu_xx_hook_mode:
        description: 'MidoriSU-XX Hook Mode'
        required: true
        default: 'branch link hijacking'
        type: choice
        options:
          - 'branch link hijacking'
          - 'syscall table tampering'
          - 'manual'
      ksu_debug:
        description: 'KernelSU Debug'
        required: true
        default: false
        type: boolean
      upload_vmlinux:
        description: 'Upload vmlinux'
        required: true
        default: false
        type: boolean
      use_ccache:
        description: 'Ccache Speedup'
        required: true
        default: true
        type: boolean
      use_adios:
        description: 'ADIOS I/O Scheduler (6.6 & 6.12 only)'
        required: true
        default: true
        type: boolean
      use_lz4_zstd:
        description: 'LZ4/ZSTD ZRAM (6.12.23 only)'
        required: true
        default: false
        type: boolean
      use_droidspaces:
        description: 'Droidspaces & NTSync'
        required: true
        default: true
        type: boolean
      use_rekernel:
        description: 'Re:Kernel(-X)'
        required: true
        default: true
        type: boolean
      enable_susfs:
        description: 'SUSFS'
        required: true
        default: true
        type: boolean
      susfs_repo:
        description: 'SUSFS Repository'
        required: false
        default: 'GitLab'
        type: choice
        options:
          - GitLab
          - GitHub
      susfs_commit:
        description: 'SUSFS Commit Hash (Leave blank for latest)'
        required: false
        default: ''
        type: string
      kernel_localversion:
        description: 'Spoof Kernel Name (Leave blank for auto)'
        required: false
        default: ''
        type: string
      build_timestamp:
        description: 'Spoof Build Time (Leave blank for now)'
        required: false
        default: ''
        type: string
      build_user_host:
        description: 'Spoof Builder (user@host)'
        required: true
        default: 'midori@build-host'
        type: string
      release_type:
        description: 'Release Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - pre-release
          - no-release
      cleanup_tags:
        description: "Cleanup Old Releases"
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  packages: write

jobs:
  fetch:
    uses: ./.github/workflows/update.yml
    with:
      kernel_version: ${{ inputs.kernel_version }}

  setup:
    needs: fetch
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.config.outputs.release_tag }}
      build_matrix: ${{ steps.config.outputs.build_matrix }}
      metadata: ${{ steps.config.outputs.metadata }}
      kernel_versions: ${{ steps.config.outputs.kernel_versions }}
      kernel_localversion: ${{ steps.config.outputs.kernel_localversion }}
      build_timestamp: ${{ steps.config.outputs.build_timestamp }}
      build_epoch: ${{ steps.config.outputs.build_epoch }}
      build_user: ${{ steps.config.outputs.build_user }}
      build_host: ${{ steps.config.outputs.build_host }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Pull latest config from fetch job
        run: |
          git fetch origin ${{ github.ref_name }} --depth=1 2>/dev/null || true
          git checkout FETCH_HEAD -- .github/config/kernel_versions.json 2>/dev/null || true

      - id: config
        name: Prepare build matrix and metadata
        run: |
          echo "release_tag=$(TZ='Asia/Tokyo' date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          config_file=".github/config/kernel_versions.json"

          if [ "${{ inputs.kernel_version }}" = "all" ]; then
            kvs='["6.1","6.6","6.12"]'
          else
            kvs='["${{ inputs.kernel_version }}"]'
          fi
          echo "kernel_versions=$kvs" >> $GITHUB_OUTPUT

          SUFFIX="-midori"
          [ "${{ inputs.enable_susfs }}" = "true" ] && SUFFIX="${SUFFIX}-susfs"
          [ "${{ inputs.use_droidspaces }}" = "true" ] && SUFFIX="${SUFFIX}-droidspaces"
          echo "kernel_localversion=${{ inputs.kernel_localversion || 'SUFFIX_PLACEHOLDER' }}" | sed "s/SUFFIX_PLACEHOLDER/$SUFFIX/" >> $GITHUB_OUTPUT

          if [ -z "${{ inputs.build_timestamp }}" ] || [ "${{ inputs.build_timestamp }}" = "''" ]; then
            build_ts="$(TZ='UTC' date +'%a %b %d %H:%M:%S UTC %Y')"
            build_ep="$(date +%s)"
          else
            build_ts="${{ inputs.build_timestamp }}"
            build_ep="$(date -d "$build_ts" +%s 2>/dev/null)"
            if [ -z "$build_ep" ]; then
              build_ts="$(TZ='UTC' date +'%a %b %d %H:%M:%S UTC %Y')"
              build_ep="$(date +%s)"
            fi
          fi
          echo "build_timestamp=$build_ts" >> $GITHUB_OUTPUT
          echo "build_epoch=$build_ep" >> $GITHUB_OUTPUT

          IFS='@' read -r build_user build_host <<< "${{ inputs.build_user_host }}"
          echo "build_user=$build_user" >> $GITHUB_OUTPUT
          echo "build_host=$build_host" >> $GITHUB_OUTPUT

          rm -f /tmp/metadata.json
          echo "$kvs" | jq -r '.[]' > /tmp/kvs.txt

          matrix='{"include":[]}'
          variant="${{ inputs.ksu_variant }}"
          
          while read kv; do
            config=$(jq -c '.["'$kv'"]' "$config_file")
            android_version=$(echo "$config" | jq -r '.android_version')
            default_sub_level=$(echo "$config" | jq -r '.default_sub_level')
            use_lts=$(echo "$config" | jq -r '.use_lts')
            
            revisions=$(echo "$config" | jq -r '.revisions | keys[]')
            sub_levels_to_build=""
            for rev in $revisions; do
              asb_date=$(echo "$config" | jq -r '.revisions["'$rev'"].asb_date')
              if [ "$use_lts" = "false" ] && [ "$asb_date" = "lts" ]; then
                continue
              fi
              sub_levels_to_build="$sub_levels_to_build $rev"
            done
            sub_levels_to_build=$(echo "$sub_levels_to_build" | tr ' ' '\n' | sort -n | uniq | tr '\n' ' ')
            
            for sub_level in $sub_levels_to_build; do
              revision=$(echo "$config" | jq -c '.revisions["'$sub_level'"]')
              asb_date=$(echo "$revision" | jq -r '.asb_date')
              r_version=$(echo "$revision" | jq -r '.default_r')
              r_suffix=$([ "$r_version" != "none" ] && echo "_$r_version" || echo '')
              clang_version=$(echo "$config" | jq -r '.default_clang')
              rust=$(echo "$config" | jq -r '.rust')
              [ "$rust" = "true" ] && rust_version=$(echo "$config" | jq -r '.default_rust') || rust_version=""
              mirror_tag=$(echo "$config" | jq -r '.mirror_tag')
              anykernel_branch=$(echo "$config" | jq -r '.anykernel_branch')
              source_commit=$(echo "$revision" | jq -r '.commit // ""')
              source_commit_date=$(echo "$revision" | jq -r '.commit_date // ""')

              if [ "$asb_date" = "lts" ]; then
                source_ref="refs/heads/${android_version}-${kv}-lts"
              elif [ "$r_version" = "none" ]; then
                source_ref="refs/heads/${android_version}-${kv}-${asb_date}"
              else
                source_ref="refs/tags/${android_version}-${kv}-${asb_date}_${r_version}"
              fi

              jq -n \
                --arg kv "$kv" \
                --arg sub_level "$sub_level" \
                --arg android_version "$android_version" \
                --arg asb_date "$asb_date" \
                --arg r_version "$r_version" \
                --arg r_suffix "$r_suffix" \
                --arg clang_version "$clang_version" \
                --arg rust_version "$rust_version" \
                --arg mirror_tag "$mirror_tag" \
                --arg anykernel_branch "$anykernel_branch" \
                --arg source_ref "$source_ref" \
                --arg source_commit "$source_commit" \
                --arg source_commit_date "$source_commit_date" \
                '{kernel_version:$kv,sub_level:$sub_level,android_version:$android_version,asb_date:$asb_date,r_version:$r_version,r_suffix:$r_suffix,clang_version:$clang_version,rust_version:$rust_version,mirror_tag:$mirror_tag,anykernel_branch:$anykernel_branch,source_ref:$source_ref,source_commit:$source_commit,source_commit_date:$source_commit_date}' >> /tmp/metadata.json

              add_variant() {
                local v=$1 has_susfs=$2
                local ds="false"
                local sus="false"
                [ "${{ inputs.use_droidspaces }}" = "true" ] && ds="true"
                [ "$has_susfs" = "true" ] && [ "${{ inputs.enable_susfs }}" = "true" ] && sus="true"
                matrix=$(echo "$matrix" | jq -c --arg kv "$kv" --arg sub_level "$sub_level" --arg variant "$v" --argjson ds "$ds" --argjson sus "$sus" '.include += [{"kernel_version":$kv,"sub_level":$sub_level,"variant":$variant,"droidspaces":$ds,"susfs":$sus}]')
              }

              [[ "$variant" =~ ^(all|MidoriSU-KX)$ ]] && add_variant MidoriSU-KX true
              [[ "$variant" =~ ^(all|MidoriSU-NX)$ ]] && add_variant MidoriSU-NX true
              [[ "$variant" =~ ^(all|MidoriSU-OX)$ ]] && add_variant MidoriSU-OX true
              [[ "$variant" =~ ^(all|MidoriSU-RX)$ ]] && add_variant MidoriSU-RX true
              [[ "$variant" =~ ^(all|MidoriSU-XX)$ ]] && add_variant MidoriSU-XX true
            done
          done < /tmp/kvs.txt

          echo "metadata=$(jq -sc '.' /tmp/metadata.json)" >> $GITHUB_OUTPUT
          echo "build_matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    name: "${{ matrix.kernel_version }}.${{ matrix.sub_level }} - ${{ matrix.variant }}${{ matrix.susfs && (matrix.droidspaces && ' (SUSFS DS)' || ' (SUSFS)') || (matrix.droidspaces && ' (DS)' || '') }}${{ inputs.use_adios && matrix.kernel_version != '6.1' && ' (ADIOS)' || '' }}${{ inputs.use_lz4_zstd && matrix.kernel_version == '6.12' && ' (LZ4/ZSTD)' || '' }}"
    needs: setup
    if: needs.setup.outputs.build_matrix != '{"include":[]}'
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    uses: ./.github/workflows/build-kernel.yml
    with:
      kernel_version: ${{ matrix.kernel_version }}
      sub_level: ${{ matrix.sub_level }}
      variant: ${{ matrix.variant }}
      use_droidspaces: ${{ matrix.droidspaces }}
      use_rekernel: ${{ inputs.use_rekernel }}
      use_adios: ${{ inputs.use_adios }}
      use_lz4_zstd: ${{ inputs.use_lz4_zstd }}
      use_susfs: ${{ matrix.susfs }}
      susfs_repo: ${{ inputs.susfs_repo }}
      source_mirror: ${{ inputs.source_mirror }}
      use_ccache: ${{ inputs.use_ccache }}
      susfs_commit: ${{ inputs.susfs_commit }}
      kernel_localversion: ${{ needs.setup.outputs.kernel_localversion }}
      build_epoch: ${{ needs.setup.outputs.build_epoch }}
      build_timestamp: ${{ needs.setup.outputs.build_timestamp }}
      build_user: ${{ needs.setup.outputs.build_user }}
      build_host: ${{ needs.setup.outputs.build_host }}
      midorisu_kx_branch: ${{ inputs.midorisu_kx_branch }}
      midorisu_nx_branch: ${{ inputs.midorisu_nx_branch }}
      midorisu_ox_branch: ${{ inputs.midorisu_ox_branch }}
      midorisu_rx_branch: ${{ inputs.midorisu_rx_branch }}
      midorisu_xx_branch: ${{ inputs.midorisu_xx_branch }}
      midorisu_rx_hook_mode: ${{ inputs.midorisu_rx_hook_mode }}
      midorisu_xx_hook_mode: ${{ inputs.midorisu_xx_hook_mode }}
      ksu_debug: ${{ inputs.ksu_debug }}
      upload_vmlinux: ${{ inputs.upload_vmlinux }}

  release:
    needs: [setup, build]
    if: |
      always() &&
      inputs.release_type != 'no-release' &&
      needs.setup.result == 'success' &&
      needs.build.result == 'success'
    strategy:
      matrix:
        kv: ${{ fromJson(needs.setup.outputs.kernel_versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load metadata for ${{ matrix.kv }}
        id: meta
        run: |
          echo '${{ needs.setup.outputs.metadata }}' | jq -c '[.[] | select(.kernel_version=="${{ matrix.kv }}")]' > /tmp/meta_array.json
          SUB_COUNT=$(jq 'length' /tmp/meta_array.json)
          if [ "$SUB_COUNT" -eq 1 ]; then
            UNAME_SUB=$(jq -r '.[0].sub_level' /tmp/meta_array.json)
          else
            UNAME_SUB="X"
          fi
          echo "UNAME_SUB=$UNAME_SUB" >> $GITHUB_ENV
          echo "KERNEL_SOURCE_INFO<<EOF" >> $GITHUB_ENV
          jq -r '.[] | 
            .source_commit_date as $d |
            ($d | sub("(?<=\\d{2}:\\d{2}):\\d{2}(?= )"; "")) as $d2 |
            if .asb_date == "lts" then
              "- **\(.kernel_version).\(.sub_level)_lts**: [`\(.source_commit[0:7])`](https://android.googlesource.com/kernel/common/+/refs/heads/\(.android_version)-\(.kernel_version)-lts) `\($d2)`"
            elif .r_version != "none" then
              "- **\(.kernel_version).\(.sub_level)_\(.r_version)**: [`\(.source_commit[0:7])`](https://android.googlesource.com/kernel/common/+/refs/tags/\(.android_version)-\(.kernel_version)-\(.asb_date)_\(.r_version)) `\($d2)`"
            else
              "- **\(.kernel_version).\(.sub_level)**: [`\(.source_commit[0:7])`](https://android.googlesource.com/kernel/common/+/refs/heads/\(.android_version)-\(.kernel_version)-\(.asb_date)) `\($d2)`"
            end
          ' /tmp/meta_array.json >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "CLANG_VERSION=$(jq -r '.[0].clang_version' /tmp/meta_array.json)" >> $GITHUB_ENV
          echo "RUST_VERSION=$(jq -r '.[0].rust_version // ""' /tmp/meta_array.json)" >> $GITHUB_ENV

      - uses: actions/download-artifact@v8
        with:
          pattern: 'commit-info-${{ matrix.kv }}-*'
          path: commit_info
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: 'Kernel-${{ matrix.kv }}-*'
          path: release_zips
          merge-multiple: true

      - name: Download KSU Toolkit Module
        run: |
          toolkit=""
          url=$(curl -sL "https://nightly.link/backslashxx/ksu_toolkit/workflows/module/master?preview" | grep -oP 'https://nightly\.link/backslashxx/ksu_toolkit/workflows/module/master/ksu_toolkit-\d+\.zip' | head -n 1)
          if [ -n "$url" ]; then
            toolkit=$(basename "$url")
            curl --fail -L -o "${{ github.workspace }}/release_zips/${toolkit}" "$url" || toolkit=""
          fi
          echo "TOOLKIT_FILE=$toolkit" >> $GITHUB_ENV

      - name: Download SUSFS Module
        if: inputs.enable_susfs == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo sidex15/susfs4ksu-module --pattern "*.zip" --dir release_zips 2>/dev/null || true

      - name: Download MidoriSU Manager APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo midori01/KernelSU --pattern "*.apk" --dir release_zips 2>/dev/null || true
          apk=$(ls release_zips/*.apk 2>/dev/null | head -n 1)
          echo "MIDORISU_APK=$(basename "$apk" 2>/dev/null)" >> $GITHUB_ENV
          echo "KSUD_VERSION=$(echo "$apk" | grep -oP '\d+(?=-release\.apk$)' || echo "unknown")" >> $GITHUB_ENV

      - name: Read Commit Info
        id: ksu_info
        run: |
          variant="${{ inputs.ksu_variant }}"
          short_sha() { cut -c1-7 "$1"; }
          out() { echo "$1" >> $GITHUB_OUTPUT; }
          ksu_line() {
            local tag=$1 repo=$2 file=$3
            [ -f "$file" ] && [[ "$variant" =~ ^(all|$tag)$ ]] || return 0
            out "${tag,,}=- **$tag**: [\`$(short_sha "$file")\`](https://github.com/$repo/commit/$(cat "$file")) \`$(cat "${file%_commit}_date")\`"
          }
          rekernel_line() {
            local label=$1 file=$2
            [ -f "$file" ] || return 0
            local sha=$(cat "$file")
            local date=$(cat "${file%_commit}_date")
            out "rekernel_line=- **${label}**: [\`$(echo $sha | cut -c1-7)\`](https://github.com/Sakion-Team/Re-Kernel/commit/$sha) \`$date\`"
          }
          rekernel_x_line() {
            local label=$1 file=$2
            [ -f "$file" ] || return 0
            local sha=$(cat "$file")
            local date=$(cat "${file%_commit}_date")
            out "rekernel_x_line=- **${label}**: [\`$(echo $sha | cut -c1-7)\`](https://github.com/myflavor/ReKernel-X/commit/$sha) \`$date\`"
          }
          if [ -f "commit_info/susfs_commit" ]; then
            sha=$(cat commit_info/susfs_commit)
            out "susfs_commit=\`$(short_sha commit_info/susfs_commit)\`"
            if [ "${{ inputs.susfs_repo }}" = "GitHub" ]; then
              out "susfs_url=https://github.com/midori01/susfs4ksu/commit/$sha"
            else
              out "susfs_url=https://gitlab.com/simonpunk/susfs4ksu/-/commit/$sha"
            fi
            out "susfs_date=\`$(cat commit_info/susfs_date)\`"
          fi
          if ls commit_info/cve_fixed_* >/dev/null 2>&1; then
            if grep -l '^false$' commit_info/cve_fixed_* >/dev/null 2>&1; then
              out "cve_fixed=false"
              out "cve_failed_subs=$(grep -l '^false$' commit_info/cve_fixed_* | sed 's/commit_info\/cve_fixed_//' | tr '\n' ' ' | sed 's/ $//')"
            else
              out "cve_fixed=true"
            fi
          fi
          if [ -f "commit_info/driver_version" ]; then
            out "driver_version=$(cat commit_info/driver_version)"
          fi
          rekernel_line "Re:Kernel" commit_info/rekernel_commit
          rekernel_x_line "Re:Kernel-X" commit_info/rekernel_x_commit
          ksu_line MidoriSU-KX "$(cat commit_info/midorisu_kx_ksu_repo 2>/dev/null)" commit_info/midorisu_kx_ksu_commit
          ksu_line MidoriSU-NX "$(cat commit_info/midorisu_nx_ksu_repo 2>/dev/null)" commit_info/midorisu_nx_ksu_commit
          ksu_line MidoriSU-OX "$(cat commit_info/midorisu_ox_ksu_repo 2>/dev/null)" commit_info/midorisu_ox_ksu_commit
          ksu_line MidoriSU-RX "$(cat commit_info/midorisu_rx_ksu_repo 2>/dev/null)" commit_info/midorisu_rx_ksu_commit
          ksu_line MidoriSU-XX "$(cat commit_info/midorisu_xx_ksu_repo 2>/dev/null)" commit_info/midorisu_xx_ksu_commit

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ needs.setup.outputs.release_tag }}-${{ matrix.kv }}"
          name: ${{ format('GKI Kernel - {0}{1}', matrix.kv, inputs.ksu_debug && ' [DEBUG]' || '') }}
          make_latest: ${{ matrix.kv == '6.12' || !contains(needs.setup.outputs.kernel_versions, ',') }}
          body: |
            ${{ env.KERNEL_SOURCE_INFO }}
            ${{ steps.ksu_info.outputs.midorisu-kx }}
            ${{ steps.ksu_info.outputs.midorisu-nx }}
            ${{ steps.ksu_info.outputs.midorisu-ox }}
            ${{ steps.ksu_info.outputs.midorisu-rx }}
            ${{ steps.ksu_info.outputs.midorisu-xx }}
            ${{ steps.ksu_info.outputs.susfs_url && format('- **SUSFS4KSU**: [{0}]({1}) {2}', steps.ksu_info.outputs.susfs_commit, steps.ksu_info.outputs.susfs_url, steps.ksu_info.outputs.susfs_date) || '' }}
            ${{ steps.ksu_info.outputs.rekernel_line }}
            ${{ steps.ksu_info.outputs.rekernel_x_line }}
            - **KSU Driver**: `${{ steps.ksu_info.outputs.driver_version || env.KSUD_VERSION }}`　**KSU Daemon (ksud)**: `${{ env.KSUD_VERSION }}`
            - **Manager**: `${{ env.MIDORISU_APK }}`
            - **Spoofed Uname**: `${{ matrix.kv }}.${{ env.UNAME_SUB }}${{ needs.setup.outputs.kernel_localversion }}`
            - **Spoofed Build Time**: `${{ needs.setup.outputs.build_timestamp }}`
            - **Spoofed Builder**: `${{ needs.setup.outputs.build_user }}@${{ needs.setup.outputs.build_host }}`
            - **Unicode Bypass Fix**: ✅　**CVE-2026-43499 Fix**: ${{ steps.ksu_info.outputs.cve_fixed == 'true' && '✅' || format('❌ ({0})', steps.ksu_info.outputs.cve_failed_subs) }}
            - **ADIOS I/O Scheduler**: ${{ inputs.use_adios && matrix.kv != '6.1' && '✅' || '❌' }}　**LZ4/ZSTD ZRAM**: ${{ inputs.use_lz4_zstd && matrix.kv == '6.12' && '✅' || '❌' }}
            - **Droidspaces**: ${{ inputs.use_droidspaces && '✅' || '❌' }}　**NTSync**: ${{ inputs.use_droidspaces && '✅' || '❌' }}　**TMPFS**: ✅
            - **TCP BBR**: ✅　**IPSET**: ✅　**Enhanced NAT**: ✅
            - **KSU Toolkit**: ${{ env.TOOLKIT_FILE && format('✅ `({0})`', env.TOOLKIT_FILE) || '❌' }}
            - **Compiler**: `clang-${{ env.CLANG_VERSION }}`${{ env.RUST_VERSION && format('　**Rust**: `{0}`', env.RUST_VERSION) || '' }}
          files: |
            release_zips/*.zip
            release_zips/*.apk
          prerelease: ${{ inputs.release_type == 'pre-release' }}

  cleanup:
    needs: release
    if: success() || failure()
